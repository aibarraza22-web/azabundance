[project]
name = "azabundance"
version = "0.1.0"
description = "Arizona Abundance Index reproducible data pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.2",
  "pandera>=0.20",
  "pyarrow>=16.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
